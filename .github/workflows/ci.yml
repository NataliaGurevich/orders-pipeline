# ВЫЗЫВАЮЩИЙ workflow:
# собственных шагов у него нет.
# Он вызывает checks.yml.

name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  # Вызываемый workflow может сохранить или уменьшить эти права,
  # но не может самостоятельно расширить их.
  contents: read

jobs:
  checks:
    # Этот идентификатор задания будет частью названия
    # проверки в pull request.
    uses: ./.github/workflows/checks.yml

    # Параметры, передаваемые вызываемому workflow.
    with:
      python-version: "3.12"
